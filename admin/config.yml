backend:
  name: git-gateway
  branch: main
  identity_url: "https://vdl-village.netlify.app/.netlify/identity"

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
    - name: "categories"
    label: "📂 Categories"
    folder: "_categories"
    create: true
    slug: "{{slug}}"
    fields:
            - {label: "Category Name", name: "title", widget: "string", hint: "Ex: Telugu Stories"}
            - label: "Category Icon"
        name: "icon"
        widget: "select"
        options:
                    - {label: "📚 Books", value: "📚"}
                    - {label: "🔬 Science", value: "🔬"}
                    - {label: "🏛️ History", value: "🏛️"}
                    - {label: "😂 Comics", value: "😂"}
                    - {label: "👤 Biography", value: "👤"}
                    - {label: "💻 Technology", value: "💻"}
                    - {label: "🎭 Stories", value: "🎭"}
                    - {label: "🌍 Geography", value: "🌍"}
                    - {label: "🎨 Art", value: "🎨"}
                    - {label: "🎵 Music", value: "🎵"}
                    - {label: "🌳 Nature", value: "🌳"}
                    - {label: "🌨️ Weather", value: "🌨️"}
                    - {label: "🌕 Astronomy", value: "🌕"}
                    - {label: "🐬 Animals", value: "🐬"}
                    - {label: "🐚 Ocean", value: "🐚"}
                    - {label: "🍗 Food", value: "🍗"}
                    - {label: "🍿 Entertainment", value: "🍿"}
                    - {label: "🚇 Transport", value: "🚇"}
                    - {label: "🚀 Space", value: "🚀"}
                    - {label: "🏡 Home", value: "🏡"}
                    - {label: "🌐 Internet", value: "🌐"}
                    - {label: "⚽ Sports", value: "⚽"}
                    - {label: "📺 Media", value: "📺"}
                    - {label: "🎙️ Podcast", value: "🎙️"}
                    - {label: "🥁 Drums", value: "🥁"}
                    - {label: "🎤 Singing", value: "🎤"}
                    - {label: "🪕 Instruments", value: "🪕"}
                    - {label: "📞 Contact", value: "📞"}
                    - {label: "📱 Mobile", value: "📱"}
                    - {label: "👑 Royal", value: "👑"}
                    - {label: "🩺 Health", value: "🩺"}
                    - {label: "💊 Medicine", value: "💊"}
                    - {label: "📝 Notes", value: "📝"}
                    - {label: "✒️ Writing", value: "✒️"}
                    - {label: "📋 List", value: "📋"}
                    - {label: "🔎 Research", value: "🔎"}
        default: "📚"
        hint: "Category kosam 36 icons lo okati select chey"

    - name: "books"
    label: "📚 Books"
    folder: "_books"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
            - {label: "Book Title", name: "title", widget: "string"}
            - {label: "Author Name", name: "author", widget: "string"}
            - label: "Category"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["icon", "title"]
        hint: "Icon tho category kanipistadi"
            - {label: "PDF File", name: "pdfUrl", widget: "file"}
            - {label: "Cover Image", name: "cover", widget: "image", required: false}
            - {label: "Description", name: "description", widget: "text", required: false}
            - {label: "Featured Book?", name: "featured", widget: "boolean", default: false}
