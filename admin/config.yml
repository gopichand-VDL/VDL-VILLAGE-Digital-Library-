backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "books"
    label: "Books"
    icon: "auto_stories"        # Sidebar lo book icon vastadi
    folder: "_books"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Book Title", name: "title", widget: "string"}
      - {label: "Author Name", name: "author", widget: "string"}
      - label: "Category"
        name: "category"
        widget: "select"
    options:
      - Story
      - Science
      - History
      - Telugu
      - English
      - Kids
    default: "Story" 
        default: "books"
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Cover Image", name: "cover", widget: "image", required: false}
      - {label: "PDF File", name: "pdf", widget: "file", required: false}