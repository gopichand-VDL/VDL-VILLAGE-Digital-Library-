backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "books"
    label: "Books"
    icon: "auto_stories"        # Sidebar lo book icon vastadi
    folder: "_books"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Book Title", name: "title", widget: "string"}
      - {label: "Author Name", name: "author", widget: "string"}
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - {label: "📚 Books", value: "books"}
          - {label: "🚀 Rocket", value: "rocket"}
          - {label: "🏠 Home", value: "home"}
          - {label: "🌐 Internet", value: "internet"}
          - {label: "⚽ Sports", value: "sports"}
          - {label: "📺 Media", value: "media"}
          - {label: "🎙️ Podcast", value: "podcast"}
          - {label: "🥁 Drums", value: "drums"}
          - {label: "🎤 Singing", value: "singing"}
          - {label: "🎸 Instruments", value:"instruments"}
          - {label: "📞 Contact", value: "contact"}
          - {label: "📱 Mobile", value: "mobile"}
          - {label: "👑 Royal", value: "royal"}
          - {label: "❤️ Health", value: "health"}
          - {label: "💊 Medicine", value: "medicine"}
          - {label: "📝 Notes", value: "notes"}
          - {label: "✍️ Writing", value: "writing"}
          - {label: "📋 List", value: "list"}
          - {label: "🔍 Research", value: "research"}     
        default:"books"
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Cover Image", name: "cover", widget: "image", required: false}
      - {label: "PDF File", name: "pdf", widget: "file", required: false}