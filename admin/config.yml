backend:
  name: github
  repo: gopichand-VDL/VDL-VILLAGE-Digital-Library-
  branch: main
  base_url: https://decap-oauth-company.vercel.app
  auth_endpoint: /auth
  app_id: Ov23lidtoMRyGuBGpqMa

media_folder: static/images/uploads
public_folder: /images/uploads

collections:
    - name: books
    label: Books
    folder: _books
    create: true
    slug: "{{slug}}"
    fields:
            - {label: Title, name: title, widget: string}
            - {label: Author, name: author, widget: string}
            - {label: Category, name: category, widget: select, options: [Story, Science, History, Telugu, English, Kids]}
            - {label: Cover Image, name: cover_image, widget: image, required: false}
            - {label: PDF File, name: pdf_file, widget: file, required: false}
